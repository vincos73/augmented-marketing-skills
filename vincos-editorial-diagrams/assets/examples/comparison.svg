  <text x="56" y="94" font-family="Barlow, Inter, sans-serif" font-size="14" font-weight="500" fill="#323232">Due dimensioni, una scelta focale</text>
  <line x1="116" y1="126" x2="116" y2="382" stroke="#072743" stroke-width="1"/>
