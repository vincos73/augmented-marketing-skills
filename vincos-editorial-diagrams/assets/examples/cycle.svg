  <text x="56" y="68" font-family="Barlow, Inter, sans-serif" font-size="30" font-weight="700" fill="#072743">Ciclo</text>
  <text x="56" y="94" font-family="Barlow, Inter, sans-serif" font-size="14" font-weight="500" fill="#323232">Le tappe alimentano una memoria comune</text>
  <path d="M442 132 C530 138 578 170 580 182 M588 262 C574 300 550 320 536 326 M458 372 C400 396 344 384 326 374 M246 326 C214 302 204 270 204 262 M212 182 C238 150 280 136 358 132" fill="none" stroke="#072743" stroke-width="1.75" marker-end="url(#cycle-arrow)"/>
