<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="cycle-title cycle-desc">
  <title id="cycle-title">Template Vincos per un ciclo</title>
  <desc id="cycle-desc">Cinque tappe in feedback attorno a una memoria centrale, con relazioni primarie leggibili.</desc>
